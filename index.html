<!DOCTYPE html>
<html>
<head>
    <title>מערכת דיווח חיצונית</title>
</head>
<body>
    <h1>שלום עולם - שרת חיצוני</h1>
    <div id="data">טוען נתונים מהגיליון...</div>

    <script>
        const API_URL = "YOUR_APPS_SCRIPT_URL_HERE";

        // משיכת נתונים מה-API של גוגל
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('data').innerText = "מצאתי " + data.length + " מוסדות בגיליון.";
                console.log(data);
            })
            .catch(err => console.error("שגיאה:", err));
    </script>
</body>
</html>
