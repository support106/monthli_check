<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דיווח תחזוקה מוסדי</title>
  <style>
    :root { --primary:#2180a8; --success:#20a874; --error:#c01f2f; --bg:#f5f5f5; --muted:#666; }
    body { font-family:sans-serif; background:var(--bg); margin:0; padding:15px; }
    .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.1); margin-bottom:16px; }
    .inst-header { border-right:5px solid var(--primary); padding-right:15px; }
    .muted { color:var(--muted); font-size:12px; }
    .btn { padding:14px; border:none; border-radius:10px; font-weight:800; cursor:pointer; color:#fff; width:100%; }
    .btn-primary { background:var(--primary); }
    .btn-ok { background:var(--success); }
    .btn-err { background:var(--error); }
    .btn-na { background:#626664; }
    .btn-secondary { background:#64748b; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn-row .btn { width:auto; flex:1; min-width:110px; }
    textarea { width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1px solid #ccc; font-family:inherit; }
    .wizard { display:none; }
    .wizard.show { display:block; }
    .report-item { padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid #e5e7eb; }
    .progress { font-size:12px; color:var(--muted); margin-bottom:10px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .p-green { background:#dcfce7; }
    .p-red { background:#fee2e2; }
    .p-yellow { background:#fef9c3; }
    input[type="month"] { width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; margin:10px 0; }
  </style>
</head>
<body>

<div id="instInfo" class="card inst-header">טוען פרטי מוסד...</div>

<div id="setup" class="card">
  <h3 style="margin-top:0;">דיווח חדש</h3>
  <label>בחר חודש דיווח:</label>
  <input type="month" id="reportMonth">
  <button class="btn btn-primary" id="btnStart">התחל דיווח</button>
  <div class="muted" style="margin-top:10px;">הלינק חייב לכלול ‎?id=TOKEN</div>
</div>

<div id="wizard" class="card wizard">
  <div class="progress" id="progress"></div>
  <div id="wizardContainer"></div>
</div>

<div class="card">
  <h3 style="margin-top:0;">היסטוריית דיווחים</h3>
  <div id="historyList">טוען היסטוריה...</div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQzzyIQgQeUQzMuFATMawQzzjDqH9-WGxpCgORVGRc5s5cRgrWYHkA9osVt-Urd9Ew/exec";

  const params = new URLSearchParams(location.search);
  const TOKEN = (params.get('id') || '').trim();

  let institution = null;
  let currentStep = 0;
  let checklistResults = [];

  // רשימת פריטים (תוסיף/תערוך כאן)
  const items = [
    { key: "yard", name: "ריצוף חצר" },
    { key: "fence", name: "גדרות" },
    { key: "fire", name: "ציוד כיבוי" },
    { key: "electricity", name: "לוחות חשמל" }
  ];

  const el = (id) => document.getElementById(id);

  function setInstCard(text) {
    el('instInfo').innerHTML = text;
  }

  function safeDate(d) {
    const dt = new Date(d);
    return isNaN(dt) ? '' : dt.toLocaleDateString('he-IL');
  }

  function pill(statusOverall, handling) {
    // צבע רקע לכל היסטוריה
    if (handling === 'סגור') return 'p-yellow';
    if (statusOverall === 'לא תקין') return 'p-red';
    return 'p-green';
  }

  async function init() {
    if (!TOKEN) {
      document.body.innerHTML = "<h2 style='font-family:sans-serif'>שגיאה: לינק לא תקין (חסר ‎?id=TOKEN)</h2>";
      return;
    }

    try {
      const res = await fetch(`${API_URL}?action=getInstitution&token=${encodeURIComponent(TOKEN)}`);
      const data = await res.json();

      if (!data || data.success === false) {
        setInstCard("<b>שגיאה:</b> מוסד לא נמצא / token לא תקין");
        return;
      }

      institution = data.data;

      setInstCard(`
        <h2 style="margin:0 0 6px;">${escapeHtml(institution['שם מוסד'] || '')}</h2>
        <div class="muted">${escapeHtml(institution['כתובת'] || '')}</div>
      `);

      await loadHistory();
    } catch (e) {
      setInstCard("<b>שגיאה:</b> לא ניתן לטעון נתונים (בדוק API_URL / פריסה)");
    }
  }

  function startWizard() {
    const month = el('reportMonth').value;
    if (!month) { alert("בחר חודש"); return; }

    el('setup').style.display = 'none';
    el('wizard').classList.add('show');
    currentStep = 0;
    checklistResults = [];
    renderStep();
  }

  function renderStep() {
    const item = items[currentStep];
    el('progress').textContent = `פריט ${currentStep + 1} מתוך ${items.length}`;

    el('wizardContainer').innerHTML = `
      <h2 style="margin:0 0 10px; text-align:center;">${escapeHtml(item.name)}</h2>

      <div class="btn-row">
        <button class="btn btn-ok" onclick="saveStep('תקין')">תקין ✅</button>
        <button class="btn btn-err" onclick="showFault()">תקול ❌</button>
        <button class="btn btn-na" onclick="saveStep('לא קיים')">לא קיים</button>
      </div>

      <div id="faultBox" style="display:none; margin-top:12px;">
        <textarea id="notesField" placeholder="פרט את התקלה..."></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveStep('לא תקין')">המשך</button>
          <button class="btn btn-secondary" onclick="hideFault()">ביטול</button>
        </div>
      </div>
    `;
  }

  window.showFault = function() {
    const box = document.getElementById('faultBox');
    if (box) box.style.display = 'block';
  };

  window.hideFault = function() {
    const box = document.getElementById('faultBox');
    if (box) box.style.display = 'none';
  };

  window.saveStep = function(status) {
    const notes = document.getElementById('notesField')?.value || '';
    checklistResults.push({
      key: items[currentStep].key,
      name: items[currentStep].name,
      status,
      notes
    });

    currentStep++;
    if (currentStep < items.length) return renderStep();
    submitReport();
  };

  async function submitReport() {
    el('wizard').innerHTML = "<h3 style='margin:0;'>שולח דיווח...</h3>";

    const hasFault = checklistResults.some(r => r.status === 'לא תקין');
    const payload = {
      token: TOKEN,
      institutionName: institution['שם מוסד'],
      month: el('reportMonth').value,
      overallStatus: hasFault ? 'לא תקין' : 'תקין',
      checklist: checklistResults
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const out = await res.json().catch(() => ({}));
      if (out && out.success === false) {
        alert("שגיאה בשליחה: " + (out.code || out.msg || 'לא ידוע'));
        location.reload();
        return;
      }

      location.reload();
    } catch (e) {
      alert("שגיאה בשליחה (בדוק API_URL / פריסה / CORS)");
      location.reload();
    }
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API_URL}?action=getReports&token=${encodeURIComponent(TOKEN)}`);
      const reports = await res.json();

      const list = Array.isArray(reports) ? reports : [];
      el('historyList').innerHTML = list.length ? list.map(r => `
        <div class="report-item ${pill(r['סטטוס כללי'], r['סטטוס טיפול'])}">
          <div><b>חודש:</b> ${escapeHtml(r['חודש'] || '')}</div>
          <div><b>סטטוס:</b> ${escapeHtml(r['סטטוס כללי'] || '')} | <b>טיפול:</b> ${escapeHtml(r['סטטוס טיפול'] || '')}</div>
          <div class="muted">הוגש ב: ${safeDate(r['תאריך'])}</div>
        </div>
      `).join('') : '<div class="muted">אין דיווחים עדיין</div>';
    } catch (e) {
      el('historyList').innerHTML = '<div class="muted">שגיאה בטעינת היסטוריה</div>';
    }
  }

  function escapeHtml(s) {
    return String(s || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  document.getElementById('btnStart').addEventListener('click', startWizard);

  init();
</script>
</body>
</html>
