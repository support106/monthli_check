<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>דיווח בטיחות</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f3; }
    .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 320px; }
    input, textarea, select, button { width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 14px; margin-top: 10px; min-height: 18px; }
    .section { text-align:right; background:#f7f7f7; padding:10px; border-radius:8px; margin: 10px 0 15px; display:none; }
    .reports { text-align:right; background:#fff; padding:10px; border-radius:8px; margin-top:15px; display:none; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:6px; border-bottom:1px solid #eee; vertical-align: top; }
    th { border-bottom:1px solid #ddd; }
    .muted { color:#666; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>דיווח טסט 📝</h2>
  <p>שליחה מה-GitHub לגיליון גוגל</p>

  <input type="text" id="token" placeholder="סמל מוסד" readonly />

  <div id="instBox" class="section"></div>

  <select id="status">
    <option value="תקין">תקין ✅</option>
    <option value="לא תקין">לא תקין ❌</option>
  </select>

  <textarea id="notes" placeholder="הערות נוספות..."></textarea>

  <button onclick="sendData()" id="submitBtn">שלח דיווח לגיליון</button>
  <div id="responseMsg" class="msg"></div>

  <div id="reportsBox" class="reports">
    <div style="font-weight:bold; margin-bottom:8px;">דיווחים קודמים</div>
    <div id="reportsContent"></div>
  </div>
</div>

<script>
  // ====== CONFIG ======
  const API_URL = "https://script.google.com/macros/s/AKfycbyQzzyIQgQeUQzMuFATMawQzzjDqH9-WGxpCgORVGRc5s5cRgrWYHkA9osVt-Urd9Ew/exec";

  // ====== HELPERS ======
  function setMsg(text, color) {
    const msg = document.getElementById("responseMsg");
    msg.style.color = color || "black";
    msg.innerText = text || "";
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return (params.get("token") || "").trim();
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(d) {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d || "");
    return dt.toLocaleString("he-IL");
  }

  // POST helper (אנחנו נמנעים מ-headers כדי להימנע מ-preflight)
  async function apiPost(payload) {
    const resp = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const text = await resp.text();
    try {
      return JSON.parse(text);
    } catch {
      return { success: false, result: "error", message: "Bad JSON from server", raw: text };
    }
  }

  // ====== RENDER ======
  function showInstitution(inst) {
    const box = document.getElementById("instBox");
    box.style.display = "block";
    box.innerHTML = `
      <div><b>שם מוסד:</b> ${escapeHtml(inst["שם מוסד"] || "")}</div>
      <div><b>כתובת:</b> ${escapeHtml(inst["כתובת"] || "")}</div>
      <div><b>סוג:</b> ${escapeHtml(inst["סוג"] || "")}</div>
      <div><b>איש קשר:</b> ${escapeHtml(inst["איש קשר"] || "")}</div>
      <div><b>טלפון:</b> ${escapeHtml(inst["טלפון"] || "")}</div>
      <div><b>Email1:</b> ${escapeHtml(inst["Email1"] || "")}</div>
      <div><b>Email2:</b> ${escapeHtml(inst["Email2"] || "")}</div>
    `;
  }

  function showReports(reports) {
    const box = document.getElementById("reportsBox");
    const content = document.getElementById("reportsContent");

    box.style.display = "block";

    if (!reports || reports.length === 0) {
      content.innerHTML = `<div class="muted">אין דיווחים קודמים למוסד זה.</div>`;
      return;
    }

    const rowsHtml = reports.map(r => `
      <tr>
        <td>${escapeHtml(formatDate(r["תאריך"]))}</td>
        <td>${escapeHtml(r["חודש"] || "")}</td>
        <td>${escapeHtml(r["סטטוס כללי"] || "")}</td>
        <td>${escapeHtml(r["סטטוס טיפול"] || "")}</td>
        <td>${escapeHtml(r["פירוט"] || "")}</td>
      </tr>
    `).join("");

    content.innerHTML = `
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>חודש</th>
              <th>סטטוס כללי</th>
              <th>סטטוס טיפול</th>
              <th>פירוט</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  // ====== LOAD DATA ======
  async function loadInstitutionAndReports(token) {
    // מוסד
    const instRes = await apiPost({ action: "getInstitution", token });
    if (!instRes || !instRes.success) {
      throw new Error(instRes?.message || "Institution not found");
    }
    showInstitution(instRes.institution);

    // דיווחים
    const repRes = await apiPost({ action: "getReports", token, limit: 50 });
    if (repRes && repRes.success) showReports(repRes.reports);
    else showReports([]);
  }

  // ====== INIT ======
  window.addEventListener("DOMContentLoaded", async () => {
    const token = getTokenFromUrl();
    document.getElementById("token").value = token;

    if (!token) {
      setMsg("חסר פרמטר token בכתובת. לדוגמה: ?token=12345", "red");
      document.getElementById("submitBtn").disabled = true;
      return;
    }

    try {
      document.getElementById("submitBtn").disabled = true;
      await loadInstitutionAndReports(token);
      document.getElementById("submitBtn").disabled = false;
      setMsg("", "black");
    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליפת נתוני מוסד/דיווחים: " + (err?.message || err), "red");
      document.getElementById("submitBtn").disabled = true;
    }
  });

  // ====== SUBMIT ======
  async function sendData() {
    const btn = document.getElementById("submitBtn");
    const token = document.getElementById("token").value.trim();

    const payload = {
      // בלי action => הבאקאנד מבין שזה "דיווח"
      token,
      status: document.getElementById("status").value,
      notes: document.getElementById("notes").value.trim()
    };

    if (!token) {
      setMsg("חסר סמל מוסד בכתובת (token).", "red");
      return;
    }

    btn.disabled = true;
    btn.innerText = "שולח...";
    setMsg("");

    try {
      const result = await apiPost(payload);

      if (result?.result === "success") {
        setMsg("הנתונים נשמרו בגיליון בהצלחה!", "green");
        document.getElementById("notes").value = "";

        // רענון רשימת דיווחים אחרי שליחה
        await loadInstitutionAndReports(token);
      } else {
        setMsg(result?.message ? ("שגיאה: " + result.message) : "הבקשה נשלחה. בדוק בגיליון.", "blue");
      }
    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליחה: " + (err?.message || err), "red");
    } finally {
      btn.disabled = false;
      btn.innerText = "שלח דיווח לגיליון";
    }
  }
</script>

</body>
</html>
