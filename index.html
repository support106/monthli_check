<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול דיווחים</title>
  <style>
    body { font-family: sans-serif; background:#eef2f3; padding: 18px; }
    .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 4px 15px rgba(0,0,0,0.08); max-width: 980px; margin: 0 auto 14px; }
    h2 { margin: 0 0 10px; }
    input, select, textarea, button { width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid #ccc; }
    textarea { resize: vertical; }
    .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn { border:0; border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:800; }
    .btn-primary { background:#1f7ae0; color:#fff; }
    .btn-secondary { background:#f1f3f5; color:#222; border:1px solid #ddd; }
    .btn-danger { background:#d9534f; color:#fff; }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { min-height:18px; font-size:13px; margin-top:8px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:8px 6px; border-bottom:1px solid #eee; vertical-align:top; }
    th { border-bottom:1px solid #ddd; white-space:nowrap; }
    .muted { color:#666; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#f1f5f9; border:1px solid #e2e8f0; font-size:12px; }
    .click { cursor:pointer; }
    .details { background:#0b1220; color:#e5e7eb; padding:12px; border-radius:12px; overflow:auto; max-height: 360px; }
  </style>
</head>
<body>

<div class="card">
  <h2>דף ניהול</h2>

  <div class="grid2">
    <div>
      <label class="muted">API URL</label>
      <input id="apiUrl" value="https://script.google.com/macros/s/AKfycbyQzzyIQgQeUQzMuFATMawQzzjDqH9-WGxpCgORVGRc5s5cRgrWYHkA9osVt-Urd9Ew/exec" />
    </div>
    <div>
      <label class="muted">מפתח ניהול (ADMIN_KEY)</label>
      <input id="adminKey" placeholder="הדבק מפתח ניהול" />
    </div>
  </div>

  <div class="msg" id="topMsg"></div>
</div>

<div class="card">
  <div class="grid">
    <div>
      <label class="muted">חודש (YYYY-MM)</label>
      <input id="month" placeholder="למשל 2026-01" />
    </div>
    <div>
      <label class="muted">טוקן</label>
      <input id="token" placeholder="למשל 12345" />
    </div>
    <div>
      <label class="muted">סטטוס טיפול</label>
      <select id="statusTreatment">
        <option value="">הכל</option>
        <option value="חדש">חדש</option>
        <option value="בטיפול">בטיפול</option>
        <option value="טופל">טופל</option>
      </select>
    </div>
  </div>

  <div class="row" style="margin-top:10px;">
    <button class="btn btn-primary" id="searchBtn">חפש</button>
    <button class="btn btn-secondary" id="clearBtn">נקה פילטרים</button>
    <span class="muted" id="countLabel"></span>
  </div>

  <div class="msg" id="searchMsg"></div>

  <div style="overflow:auto; margin-top:10px;">
    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>מוסד</th>
          <th>טוקן</th>
          <th>חודש</th>
          <th>סטטוס כללי</th>
          <th>סטטוס טיפול</th>
          <th>סיכום</th>
        </tr>
      </thead>
      <tbody id="reportsTbody">
        <tr><td colspan="7" class="muted">בצע חיפוש כדי לראות תוצאות.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="card" id="detailsCard" style="display:none;">
  <h2 style="margin-bottom:8px;">פרטי דיווח</h2>
  <div class="grid2">
    <div>
      <div class="muted">ReportId</div>
      <div id="dReportId" class="pill"></div>
    </div>
    <div>
      <div class="muted">סטטוס טיפול</div>
      <select id="dStatusTreatment">
        <option value="חדש">חדש</option>
        <option value="בטיפול">בטיפול</option>
        <option value="טופל">טופל</option>
      </select>
    </div>
  </div>

  <div style="margin-top:10px;">
    <div class="muted">הערות הנהלה</div>
    <textarea id="dNotesMgmt" rows="3" placeholder="הערות פנימיות..."></textarea>
  </div>

  <div class="row" style="margin-top:10px;">
    <button class="btn btn-primary" id="saveBtn">שמור עדכון</button>
    <button class="btn btn-secondary" id="closeDetailsBtn">סגור</button>
    <div class="msg" id="detailsMsg" style="flex:1;"></div>
  </div>

  <div style="margin-top:10px;">
    <div class="muted">פירוט (JSON / שאלות)</div>
    <pre class="details" id="dJson"></pre>
  </div>
</div>

<script>
  function $(id){ return document.getElementById(id); }

  function setMsg(el, text, color){
    el.style.color = color || "black";
    el.textContent = text || "";
  }

  async function apiPost(payload){
    const url = $("apiUrl").value.trim();
    const resp = await fetch(url, { method:"POST", body: JSON.stringify(payload) });
    const text = await resp.text();
    try { return JSON.parse(text); } catch { return { success:false, result:"error", message:"Bad JSON", raw:text }; }
  }

  function getAuth(){
    const adminKey = $("adminKey").value.trim();
    if (!adminKey) throw new Error("חסר מפתח ניהול");
    return { adminKey };
  }

  function renderReports(list){
    const tb = $("reportsTbody");
    if (!list || list.length === 0){
      tb.innerHTML = `<tr><td colspan="7" class="muted">אין תוצאות.</td></tr>`;
      return;
    }

    tb.innerHTML = list.map(r => `
      <tr class="click" data-reportid="${String(r.reportId||"").replace(/"/g,'&quot;')}">
        <td>${escapeHtml(String(r.date||""))}</td>
        <td>${escapeHtml(String(r.institutionName||""))}</td>
        <td>${escapeHtml(String(r.token||""))}</td>
        <td>${escapeHtml(String(r.month||""))}</td>
        <td>${escapeHtml(String(r.overallStatus||""))}</td>
        <td><span class="pill">${escapeHtml(String(r.statusTreatment||""))}</span></td>
        <td>${escapeHtml(String(r.summary||""))}</td>
      </tr>
    `).join("");

    [...tb.querySelectorAll("tr[data-reportid]")].forEach(tr=>{
      tr.addEventListener("click", ()=> openDetails(tr.getAttribute("data-reportid")));
    });
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  let currentReportId = "";

  async function search(){
    try{
      setMsg($("searchMsg"), "טוען...", "#555");
      const { adminKey } = getAuth();

      const token = $("token").value.trim();
      const month = $("month").value.trim();
      const statusTreatment = $("statusTreatment").value;

      const res = await apiPost({
        action:"adminSearchReports",
        adminKey, token, month, statusTreatment,
        limit: 100, offset: 0
      });

      if (!res.success) throw new Error(res.message || "שגיאה");

      $("countLabel").textContent = `נמצאו ${res.total} תוצאות`;
      renderReports(res.reports);
      setMsg($("searchMsg"), "", "black");
    } catch(e){
      console.error(e);
      $("countLabel").textContent = "";
      renderReports([]);
      setMsg($("searchMsg"), "שגיאה: " + (e.message||e), "red");
    }
  }

  async function openDetails(reportId){
    try{
      setMsg($("detailsMsg"), "טוען פרטי דיווח...", "#555");
      const { adminKey } = getAuth();

      const res = await apiPost({ action:"adminGetReport", adminKey, reportId });
      if (!res.success) throw new Error(res.message || "שגיאה");

      currentReportId = reportId;
      $("detailsCard").style.display = "block";
      $("dReportId").textContent = reportId;

      // עדכון שדות
      const r = res.report || {};
      $("dStatusTreatment").value = String(r["סטטוס טיפול"] || "חדש");
      $("dNotesMgmt").value = String(r["הערות הנהלה"] || "");

      // פירוט JSON
      const details = res.details;
      if (details) $("dJson").textContent = JSON.stringify(details, null, 2);
      else $("dJson").textContent = String(r["פירוט"] || "");

      setMsg($("detailsMsg"), "", "black");
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    } catch(e){
      console.error(e);
      setMsg($("detailsMsg"), "שגיאה: " + (e.message||e), "red");
    }
  }

  async function saveDetails(){
    try{
      if (!currentReportId) return;
      setMsg($("detailsMsg"), "שומר...", "#555");
      const { adminKey } = getAuth();

      const statusTreatment = $("dStatusTreatment").value;
      const notesMgmt = $("dNotesMgmt").value;

      const res = await apiPost({
        action:"adminUpdateReport",
        adminKey,
        reportId: currentReportId,
        statusTreatment,
        notesMgmt
      });

      if (!res.success) throw new Error(res.message || "שגיאה");
      setMsg($("detailsMsg"), "נשמר ✅", "green");

      // רענון הרשימה כדי לראות סטטוס טיפול חדש
      await search();
    } catch(e){
      console.error(e);
      setMsg($("detailsMsg"), "שגיאה: " + (e.message||e), "red");
    }
  }

  function clearFilters(){
    $("month").value = "";
    $("token").value = "";
    $("statusTreatment").value = "";
    $("countLabel").textContent = "";
    $("reportsTbody").innerHTML = `<tr><td colspan="7" class="muted">בצע חיפוש כדי לראות תוצאות.</td></tr>`;
    $("detailsCard").style.display = "none";
    setMsg($("searchMsg"), "", "black");
  }

  // init
  $("searchBtn").addEventListener("click", search);
  $("clearBtn").addEventListener("click", clearFilters);
  $("saveBtn").addEventListener("click", saveDetails);
  $("closeDetailsBtn").addEventListener("click", ()=>{ $("detailsCard").style.display="none"; currentReportId=""; });

  // enter to search
  ["month","token","adminKey"].forEach(id=>{
    $(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter") search(); });
  });
</script>

</body>
</html>
