<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <title>דיווח בטיחות</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f3; }
    .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 320px; }
    input, textarea, select, button { width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .msg { font-size: 14px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>דיווח טסט 📝</h2>
  <p>שליחה מה-GitHub לגיליון גוגל</p>

  <input type="text" id="token" placeholder="סמל מוסד" readonly>

  <div id="instBox" style="text-align:right; background:#f7f7f7; padding:10px; border-radius:8px; margin-bottom:15px; display:none;"></div>

  <select id="status">
    <option value="תקין">תקין ✅</option>
    <option value="לא תקין">לא תקין ❌</option>
  </select>

  <textarea id="notes" placeholder="הערות נוספות..."></textarea>

  <button onclick="sendData()" id="submitBtn">שלח דיווח לגיליון</button>
  <div id="responseMsg" class="msg"></div>

  <div id="reportsBox" style="text-align:right; background:#fff; padding:10px; border-radius:8px; margin-top:15px; display:none;">
    <div style="font-weight:bold; margin-bottom:8px;">דיווחים קודמים</div>
    <div id="reportsContent"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQzzyIQgQeUQzMuFATMawQzzjDqH9-WGxpCgORVGRc5s5cRgrWYHkA9osVt-Urd9Ew/exec";

  // --- helpers ---
  function setMsg(text, color) {
    const msg = document.getElementById('responseMsg');
    msg.style.color = color || "black";
    msg.innerText = text || "";
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return (params.get("token") || "").trim();
  }

  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");

      window[cbName] = (data) => { resolve(data); cleanup(); };

      function cleanup() {
        try { delete window[cbName]; } catch {}
        script.remove();
      }

      script.onerror = () => { cleanup(); reject(new Error("JSONP load failed")); };

      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + encodeURIComponent(cbName);
      document.body.appendChild(script);
    });
  }

  function formatDate(d) {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d || '');
    return dt.toLocaleString('he-IL');
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showInstitution(inst) {
    const box = document.getElementById("instBox");
    box.style.display = "block";
    box.innerHTML = `
      <div><b>שם מוסד:</b> ${escapeHtml(inst["שם מוסד"] || "")}</div>
      <div><b>כתובת:</b> ${escapeHtml(inst["כתובת"] || "")}</div>
      <div><b>סוג:</b> ${escapeHtml(inst["סוג"] || "")}</div>
      <div><b>איש קשר:</b> ${escapeHtml(inst["איש קשר"] || "")}</div>
      <div><b>טלפון:</b> ${escapeHtml(inst["טלפון"] || "")}</div>
      <div><b>Email1:</b> ${escapeHtml(inst["Email1"] || "")}</div>
      <div><b>Email2:</b> ${escapeHtml(inst["Email2"] || "")}</div>
    `;
  }

  function showReports(reports) {
    const box = document.getElementById("reportsBox");
    const content = document.getElementById("reportsContent");
    if (!box || !content) return;

    box.style.display = "block";

    if (!reports || reports.length === 0) {
      content.innerHTML = `<div style="color:#666;">אין דיווחים קודמים למוסד זה.</div>`;
      return;
    }

    const rowsHtml = reports.map(r => `
      <tr>
        <td style="border-bottom:1px solid #eee; padding:6px;">${escapeHtml(formatDate(r["תאריך"]))}</td>
        <td style="border-bottom:1px solid #eee; padding:6px;">${escapeHtml(r["חודש"] || "")}</td>
        <td style="border-bottom:1px solid #eee; padding:6px;">${escapeHtml(r["סטטוס כללי"] || "")}</td>
        <td style="border-bottom:1px solid #eee; padding:6px;">${escapeHtml(r["סטטוס טיפול"] || "")}</td>
        <td style="border-bottom:1px solid #eee; padding:6px;">${escapeHtml(r["פירוט"] || "")}</td>
      </tr>
    `).join("");

    content.innerHTML = `
      <div style="overflow:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr>
              <th style="border-bottom:1px solid #ddd; padding:6px;">תאריך</th>
              <th style="border-bottom:1px solid #ddd; padding:6px;">חודש</th>
              <th style="border-bottom:1px solid #ddd; padding:6px;">סטטוס כללי</th>
              <th style="border-bottom:1px solid #ddd; padding:6px;">סטטוס טיפול</th>
              <th style="border-bottom:1px solid #ddd; padding:6px;">פירוט</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  async function loadInstitutionAndReports(token) {
    // 1) מוסד
    const instUrl = `${API_URL}?action=getInstitution&token=${encodeURIComponent(token)}`;
    const instRes = await jsonp(instUrl);

    if (!instRes || !instRes.success) {
      throw new Error(instRes?.message || "Institution not found");
    }

    showInstitution(instRes.institution);

    // 2) דיווחים
    const reportsUrl = `${API_URL}?action=getReports&token=${encodeURIComponent(token)}&limit=50`;
    const repRes = await jsonp(reportsUrl);

    if (repRes && repRes.success) showReports(repRes.reports);
    else showReports([]);
  }

  // --- init ---
  window.addEventListener("DOMContentLoaded", async () => {
    const token = getTokenFromUrl();
    document.getElementById("token").value = token;

    if (!token) {
      setMsg("חסר פרמטר token בכתובת. לדוגמה: ?token=12345", "red");
      document.getElementById("submitBtn").disabled = true;
      return;
    }

    try {
      document.getElementById("submitBtn").disabled = true;
      await loadInstitutionAndReports(token);
      document.getElementById("submitBtn").disabled = false;
      setMsg("", "black");
    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליפת נתוני מוסד/דיווחים: " + (err?.message || err), "red");
      document.getElementById("submitBtn").disabled = true;
    }
  });

  // --- submit ---
  async function sendData() {
    const btn = document.getElementById('submitBtn');
    const token = document.getElementById('token').value.trim();

    const payload = {
      token,
      status: document.getElementById('status').value,
      notes: document.getElementById('notes').value.trim()
    };

    if (!token) {
      setMsg("חסר סמל מוסד בכתובת (token).", "red");
      return;
    }

    btn.disabled = true;
    btn.innerText = "שולח...";
    setMsg("");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      let result = null;
      try { result = JSON.parse(text); } catch {}

      if (result?.result === "success") {
        setMsg("הנתונים נשמרו בגיליון בהצלחה!", "green");
        document.getElementById('notes').value = "";

        // רענון דיווחים אחרי שליחה
        await loadInstitutionAndReports(token);

      } else {
        setMsg(result?.message ? ("שגיאה: " + result.message) : "הבקשה נשלחה. בדוק בגיליון.", "blue");
      }

    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליחה: " + (err?.message || err), "red");
    } finally {
      btn.disabled = false;
      btn.innerText = "שלח דיווח לגיליון";
    }
  }
</script>

</body>
</html>
