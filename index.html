<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>טסט כתיבה לגיליון</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f3; }
    .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 320px; }
    input, textarea, select, button { width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .msg { font-size: 14px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>דיווח טסט 📝</h2>
  <p>שליחה מה-GitHub לגיליון גוגל</p>

<input type="text" id="token" placeholder="סמל מוסד" readonly>
<div id="instBox" style="text-align:right; background:#f7f7f7; padding:10px; border-radius:8px; margin-bottom:15px; display:none;"></div>
  <select id="status">
    <option value="תקין">תקין ✅</option>
    <option value="לא תקין">לא תקין ❌</option>
  </select>
  <textarea id="notes" placeholder="הערות נוספות..."></textarea>

  <button onclick="sendData()" id="submitBtn">שלח דיווח לגיליון</button>
  <div id="responseMsg" class="msg"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQzzyIQgQeUQzMuFATMawQzzjDqH9-WGxpCgORVGRc5s5cRgrWYHkA9osVt-Urd9Ew/exec";

function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");

      window[cbName] = (data) => {
        resolve(data);
        cleanup();
      };

      function cleanup() {
        delete window[cbName];
        script.remove();
      }

      script.onerror = () => {
        cleanup();
        reject(new Error("JSONP load failed"));
      };

      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + encodeURIComponent(cbName);
      document.body.appendChild(script);
    });
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return (params.get("token") || "").trim();
  }

  function showInstitution(inst) {
    const box = document.getElementById("instBox");
    box.style.display = "block";

    // מציג יפה (אפשר לשנות עיצוב בהמשך)
    box.innerHTML = `
      <div><b>שם מוסד:</b> ${inst["שם מוסד"] || ""}</div>
      <div><b>כתובת:</b> ${inst["כתובת"] || ""}</div>
      <div><b>סוג:</b> ${inst["סוג"] || ""}</div>
      <div><b>איש קשר:</b> ${inst["איש קשר"] || ""}</div>
      <div><b>טלפון:</b> ${inst["טלפון"] || ""}</div>
      <div><b>Email1:</b> ${inst["Email1"] || ""}</div>
      <div><b>Email2:</b> ${inst["Email2"] || ""}</div>
    `;
  }

  window.addEventListener("DOMContentLoaded", async () => {
    const token = getTokenFromUrl();
    const tokenInput = document.getElementById("token");
    tokenInput.value = token;

    if (!token) {
      setMsg("חסר פרמטר token בכתובת. לדוגמה: ?token=12345", "red");
      document.getElementById("submitBtn").disabled = true;
      return;
    }

    // מביא את פרטי המוסד מהגיליון
    try {
      const url = `${API_URL}?action=getInstitution&token=${encodeURIComponent(token)}`;
      const res = await jsonp(url);

      if (!res.success) {
        setMsg("לא נמצא מוסד לפי הטוקן: " + (res.message || ""), "red");
        document.getElementById("submitBtn").disabled = true;
        return;
      }

      showInstitution(res.institution);
      setMsg("", "black");
      // אפשר להשאיר שליחה פעילה רק אם נמצא מוסד
      document.getElementById("submitBtn").disabled = false;

    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליפת נתוני מוסד.", "red");
      document.getElementById("submitBtn").disabled = true;
    }
  });
  
  function setMsg(text, color) {
    const msg = document.getElementById('responseMsg');
    msg.style.color = color || "black";
    msg.innerText = text || "";
  }


  // רץ כשהדף נטען
  window.addEventListener("DOMContentLoaded", () => {
    const token = getTokenFromUrl();
    const tokenInput = document.getElementById("token");

    tokenInput.value = token;

    if (!token) {
      setMsg("חסר פרמטר token בכתובת. לדוגמה: ?token=12345", "red");
      document.getElementById("submitBtn").disabled = true;
    }
  });

  async function sendData() {
    const btn = document.getElementById('submitBtn');

    const payload = {
      token: document.getElementById('token').value.trim(),
      status: document.getElementById('status').value,
      notes: document.getElementById('notes').value.trim()
    };

    if (!payload.token) {
      setMsg("חסר סמל מוסד בכתובת (token).", "red");
      return;
    }

    btn.disabled = true;
    btn.innerText = "שולח...";
    setMsg("");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      let result = null;
      try { result = JSON.parse(text); } catch {}

      if (result?.result === "success") {
        setMsg("הנתונים נשמרו בגיליון בהצלחה!", "green");
        document.getElementById('notes').value = "";
      } else {
        setMsg(result?.message ? ("שגיאה: " + result.message) : "הבקשה נשלחה. בדוק בגיליון.", "blue");
      }

    } catch (err) {
      console.error(err);
      setMsg("שגיאה בשליחה: " + (err?.message || err), "red");
    } finally {
      btn.disabled = false;
      btn.innerText = "שלח דיווח לגיליון";
    }
  }
</script>
</body>
</html>
