<style>
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
    .close { float: left; cursor: pointer; font-size: 24px; }
    .delete-btn { color: var(--error); cursor: pointer; font-size: 18px; padding: 5px; }
    .history-item { cursor: pointer; transition: transform 0.2s; position: relative; }
    .history-item:hover { transform: scale(1.02); }
</style>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">פרטי דיווח</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // פונקציה לעיצוב חודש מתאריך ISO או חודש (YYYY-MM)
    function formatMonthYear(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
    }

    async function loadHistory() {
        const res = await fetch(`${API_URL}?action=getReports&token=${TOKEN}`);
        const reports = await res.json();
        const container = document.getElementById('historyList');
        
        container.innerHTML = reports.map(r => {
            let color = r['סטטוס כללי'] === 'תקין' ? '#dcfce7' : '#fee2e2';
            if (r['סטטוס טיפול'] === 'סגור') color = '#fef9c3';
            
            return `
                <div class="report-item history-item" style="background:${color}" onclick="viewDetails('${encodeURIComponent(JSON.stringify(r))}')">
                    <div style="display:flex; justify-content:space-between;">
                        <strong>${formatMonthYear(r['חודש'] || r['חודש דיווח'])}</strong>
                        <span class="delete-btn" onclick="deleteReport(event, '${r['תאריך']}')">🗑️</span>
                    </div>
                    <small>סטטוס: ${r['סטטוס כללי']} | הוגש ב: ${new Date(r['תאריך']).toLocaleDateString('he-IL')}</small>
                </div>
            `;
        }).join('');
    }

    function viewDetails(encodedData) {
        const report = JSON.parse(decodeURIComponent(encodedData));
        const checklist = JSON.parse(report['פירוט'] || '[]');
        
        let html = `<h3>${formatMonthYear(report['חודש'])}</h3><hr>`;
        checklist.forEach(item => {
            const icon = item.status === 'תקין' ? '✅' : (item.status === 'לא תקין' ? '❌' : '⚪');
            html += `<p><strong>${item.name}:</strong> ${icon} ${item.status} ${item.notes ? '<br><small>הערה: ' + item.notes + '</small>' : ''}</p>`;
        });
        
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('detailsModal').style.display = 'block';
    }

    async function deleteReport(event, timestamp) {
        event.stopPropagation(); // מונע פתיחת מודאל כשלוחצים על מחיקה
        if (!confirm("האם אתה בטוח שברצונך למחוק את הדיווח?")) return;
        
        await fetch(`${API_URL}?action=deleteReport&token=${TOKEN}&timestamp=${timestamp}`);
        loadHistory();
    }

    function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }
</script>
