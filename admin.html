<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>ניהול דיווחי בטיחות</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .filter-bar { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f9f9f9; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<h2>📈 לוח בקרה - דיווחי מוסדות</h2>

<div class="filter-bar">
    <input type="text" id="filterInst" placeholder="סנן לפי מוסד..." oninput="renderTable()">
    <input type="month" id="filterMonth" onchange="renderTable()">
    <select id="filterStatus" onchange="renderTable()">
        <option value="">כל הסטטוסים</option>
        <option value="פתוח">פתוח</option>
        <option value="סגור">סגור</option>
    </select>
</div>

<table id="reportsTable">
    <thead>
        <tr>
            <th>תאריך</th>
            <th>מוסד</th>
            <th>חודש</th>
            <th>מצב</th>
            <th>סטטוס טיפול</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    const API_URL = "YOUR_GAS_URL";
    let allReports = [];

    async function loadReports() {
        const res = await fetch(`${API_URL}?action=getReports`);
        allReports = await res.json();
        renderTable();
    }

    function renderTable() {
        const instVal = document.getElementById('filterInst').value;
        const monthVal = document.getElementById('filterMonth').value;
        const statusVal = document.getElementById('filterStatus').value;
        
        const filtered = allReports.filter(r => {
            return (!instVal || r['שם מוסד'].includes(instVal)) &&
                   (!monthVal || r['חודש'] === monthVal) &&
                   (!statusVal || r['סטטוס טיפול'] === statusVal);
        });

        document.getElementById('tableBody').innerHTML = filtered.map(r => `
            <tr>
                <td>${new Date(r['תאריך']).toLocaleDateString('he-IL')}</td>
                <td>${r['שם מוסד']}</td>
                <td>${r['חודש']}</td>
                <td>${r['סטטוס כללי']}</td>
                <td><span class="status-tag" style="background:${r['סטטוס טיפול'] === 'סגור' ? '#fef9c3' : '#fee2e2'}">${r['סטטוס טיפול']}</span></td>
            </tr>
        `).join('');
    }

    loadReports();
</script>
</body>
</html>
